    <noscript>
      <style>
        #theme-switcher {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body class="pxlnic-theme">
    <main>
      <div class="content links-page-content">
        <header style="position: absolute; top: 0; left: 0; margin: 0; padding: 0; opacity: 0"><a rel="me" href="https://mastodon.social/@pxlnic">Mastodon</a></header>
        <h1 class="heading">pxlnic</h1>
        <p class="sub-heading">pixel artist, nerd, tech enthusiast</p>
        <!-- Theme Switcher -->
        <form class="theme-switcher">
          <span>
            <!-- Hidden Radio Button for Switching -->
            <!-- Light Theme -->
            <input name="theme" type="radio" class="theme-light" value="light" id="light" />
            <label class="theme-light" for="light">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path d="M64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320z"></path></svg
            ></label>
            <!-- Auto Theme: Default -->
            <input name="theme" type="radio" class="theme-auto" value="auto" id="auto" checked />
            <label class="theme-auto" for="auto">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path d="M512 320C512 214 426 128 320 128L320 512C426 512 512 426 512 320zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320z"></path></svg
            ></label>
            <!-- Dark Theme -->
            <input name="theme" type="radio" class="theme-dark" value="dark" id="dark" />
            <label class="theme-dark" for="dark">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.-->
                <path d="M528 320C528 205.1 434.9 112 320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320zM64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576C178.6 576 64 461.4 64 320z"></path></svg
            ></label>
          </span>
        </form>
        <!-- Main Links -->
        <div class="links">
          <!-- Ko-Fi -->
          <a href="https://ko-fi.com/pxlnic" class="link rounded-5" target="_blank">
            <div class="icon ko-fi"></div>
            <p>ko-fi | assets, commissions, tips</p></a
          >
          <!-- Threadless -->
          <a href="https://pxlnic.threadless.com/" class="link rounded-5" target="_blank">
            <div class="icon shopping-cart"></div>
            <p>merch</p></a
          >
          <!-- Portfolio -->
          <a href="https://pxlnic.com" class="link rounded-5" target="_blank">
            <div class="icon pxlnic"></div>
            <p>portfolio</p></a
          >
        </div>
        <hr />
        <!-- Social Links -->
        <div class="links last">
          <!-- Bluesky -->
          <a href="https://bsky.app/profile/pxlnic.bsky.social" class="link rounded-5" target="_blank">
            <div class="icon bluesky"></div>
            <p>bluesky</p></a
          >
          <!-- Instagram -->
          <a href="https://www.instagram.com/pxlnic/" class="link rounded-5" target="_blank">
            <div class="icon instagram"></div>
            <p>instagram</p></a
          >
          <!-- Lospec -->
          <a href="https://lospec.com/pxlnic" class="link rounded-5" target="_blank">
            <div class="icon lospec"></div>
            <p>lospec</p></a
          >
          <!-- Mastodon -->
          <a href="https://mastodon.social/@pxlnic" class="link rounded-5" target="_blank">
            <div class="icon mastodon"></div>
            <p>mastodon.social</p></a
          >
          <!-- Threads -->
          <a href="https://www.threads.com/@pxlnic" class="link rounded-5" target="_blank">
            <div class="icon threads"></div>
            <p>threads</p></a
          >
        </div>
      </div>
    </main>
    <footer>2026 | Nic Reichelt | All Rights Reserved</footer>

    <!-- Umami External Link Tracking -->
    <script type="text/javascript">
      (() => {
        const name = "outbound-link-click";
        document.querySelectorAll("a").forEach((a) => {
          if (a.host !== window.location.host && !a.getAttribute("data-umami-event")) {
            a.setAttribute("data-umami-event", name);
            a.setAttribute("data-umami-event-url", a.href);
          }
        });
      })();
    </script>
  </body>
</html>
